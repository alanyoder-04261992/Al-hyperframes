name: Render Barnwright samples

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: barnwright-render-${{ github.ref }}
  cancel-in-progress: false

env:
  HYPERFRAMES_NO_TELEMETRY: "1"

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: examples/barnwright
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          lfs: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Install FFmpeg and Chrome runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg libnss3 libatk-bridge2.0-0 libxkbcommon0 libgbm1 libasound2t64 libxcomposite1 libxdamage1 libxrandr2 libcups2
      - name: Install pinned sample dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Prepare local animation asset
        run: npm run prepare-assets
      - name: Install HyperFrames pinned browser
        run: npx --no-install hyperframes browser ensure
      - name: Validate composition
        run: npm run check
      - name: Render two silent 1080p MP4s
        run: npm run render
      - name: Verify output
        run: |
          for video in renders/barnwright-shed.mp4 renders/barnwright-typography.mp4; do
            test -s "$video"
            ffprobe -v error -show_format -show_streams -of json "$video" > renders/probe.json
            node verify-render.cjs renders/probe.json
          done
      - name: Upload downloadable MP4
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: barnwright-mp4
          path: examples/barnwright/renders/*.mp4
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
