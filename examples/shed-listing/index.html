<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1080, height=1080" />
<title>Shed listing — sample</title>
<script src="assets/gsap.min.js"></script>
<style>
html, body { margin: 0; width: 100%; height: 100%; background: #1d1a17; color: #f4ecd8; font-family: sans-serif; }
#root { position: relative; width: 100%; height: 100%; overflow: hidden; }
.backdrop { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 38%, #3a2f27, #1d1a17 68%); }
.ground { position: absolute; left: 0; right: 0; top: 600px; height: 480px; background: linear-gradient(#2a3a26, #1d1a17 70%); opacity: 0.55; }
.eyebrow { position: absolute; top: 56px; left: 0; right: 0; text-align: center; font-size: 26px; font-weight: 700; letter-spacing: 8px; color: #e8bf72; }
.clip { position: absolute; inset: 0; }
#shed-wrap { position: absolute; left: 160px; top: 120px; width: 760px; height: 520px; }
#shed-svg { display: block; width: 760px; height: 520px; transform-origin: 50% 90%; }
.copy { position: absolute; left: 80px; right: 80px; top: 680px; text-align: center; }
h1 { margin: 0 0 20px; font-size: 84px; line-height: 1.05; letter-spacing: -2px; }
p { margin: 0; font-size: 36px; line-height: 1.35; color: #d9cfbb; }
.chips { display: flex; justify-content: center; gap: 20px; margin-top: 8px; }
.chip { display: block; padding: 16px 24px; border: 3px solid #e8bf72; border-radius: 999px; font-size: 28px; white-space: nowrap; font-weight: 700; color: #f4ecd8; background: #2b241e; }
.features-title { margin: 0 0 28px; font-size: 40px; font-weight: 700; color: #e8bf72; letter-spacing: 2px; }
.price { display: block; margin: 0 0 12px; font-size: 150px; font-weight: 800; line-height: 1; letter-spacing: -4px; color: #ffffff; }
.cta { margin: 0 0 22px; font-size: 72px; line-height: 1.1; letter-spacing: -1px; }
.dealer { font-size: 38px; color: #e8bf72; font-weight: 700; }
.note { position: absolute; bottom: 30px; left: 0; right: 0; text-align: center; font-size: 22px; color: #a99f8c; letter-spacing: 1px; }
</style>
</head>
<body>
<div id="root" data-composition-id="shed-listing" data-start="0" data-duration="20" data-width="1080" data-height="1080">
<div class="backdrop"></div>
<div class="ground"></div>
<div class="eyebrow">ON THE LOT NOW</div>

<section class="clip" id="shed-scene" data-start="0" data-duration="20" data-track-index="2">
<div id="shed-wrap">
<svg id="shed-svg" viewBox="0 0 760 520" aria-label="Illustration of a 10 by 16 utility shed">
<ellipse cx="400" cy="478" rx="330" ry="26" fill="#000000" opacity="0.35" />
<g fill="none" stroke="#f4ecd8" stroke-width="5" stroke-linejoin="round" stroke-linecap="round">
<path class="draw fill" pathLength="1" d="M260 120 L550 85 L705 192 L412 228 Z" fill="#4a2a24" />
<path class="draw fill" pathLength="1" d="M400 230 L690 196 L690 432 L400 470 Z" fill="#8f2a1e" />
<path class="draw fill" pathLength="1" d="M120 230 L260 120 L400 230 L400 470 L120 470 Z" fill="#a83526" />
<path class="draw fill" pathLength="1" d="M190 300 H330 V470 H190 Z" fill="#9a3022" />
<path id="door-glow" d="M190 300 H330 V470 H190 Z" fill="#e8bf72" stroke="none" opacity="0" />
<path class="draw" pathLength="1" d="M260 300 V470 M190 300 L260 470 M260 300 L190 470 M260 300 L330 470 M330 300 L260 470" stroke-width="4" />
<path class="draw fill" pathLength="1" d="M505 270 L585 261 L585 330 L505 339 Z" fill="#bcd6df" />
<path id="window-glow" d="M505 270 L585 261 L585 330 L505 339 Z" fill="#e8bf72" stroke="none" opacity="0" />
<path class="draw" pathLength="1" d="M545 265.5 V334.5 M505 304.5 L585 295.5" stroke-width="4" />
<path class="draw" pathLength="1" d="M98 246 L260 106 L422 246" stroke-width="9" />
<path class="draw" pathLength="1" d="M440 236 L470 232 M480 231 L660 210" stroke="#e0d3b8" stroke-width="3" opacity="0.4" />
</g>
</svg>
</div>
</section>

<section class="clip" id="intro" data-start="0" data-duration="5" data-track-index="1">
<div class="copy" id="intro-copy"><h1>10×16 Utility Shed</h1><p>Just delivered to the lot</p></div>
</section>

<section class="clip" id="features" data-start="5" data-duration="5" data-track-index="1">
<div class="copy" id="features-copy">
<div class="features-title">BUILT IN</div>
<div class="chips"><span class="chip" id="chip-doors">Double barn doors</span><span class="chip" id="chip-window">Side window</span><span class="chip" id="chip-ready">Ready to deliver</span></div>
</div>
</section>

<section class="clip" id="pricing" data-start="10" data-duration="5" data-track-index="1">
<div class="copy" id="pricing-copy"><span class="price" id="price">$4,200</span><p>Cash or rent-to-own</p></div>
</section>

<section class="clip" id="outro" data-start="15" data-duration="5" data-track-index="1">
<div class="copy" id="outro-copy"><div class="cta">Stop by or call today</div><p class="dealer">Your Dealer Name · (555) 555-0123</p></div>
</section>

<div class="note">Sample listing · placeholder size, price and contact</div>
</div>
<script>
const tl = gsap.timeline({ paused: true });

tl.fromTo("#shed-wrap", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.8, ease: "power2.out" }, 0.1);
tl.fromTo("#shed-svg .draw", { strokeDasharray: 1, strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 1.6, stagger: 0.18, ease: "power1.inOut" }, 0.3);
tl.fromTo("#shed-svg .fill", { fillOpacity: 0 }, { fillOpacity: 1, duration: 1, stagger: 0.1, ease: "power1.out" }, 2.6);
tl.fromTo("#shed-svg", { scale: 1 }, { scale: 1.05, duration: 19.5, ease: "none" }, 0.5);

for (const [selector, start] of [["#intro-copy", 0], ["#features-copy", 5], ["#pricing-copy", 10], ["#outro-copy", 15]]) {
  tl.fromTo(selector, { opacity: 0, y: 28 }, { opacity: 1, y: 0, duration: 0.7, ease: "power2.out" }, start + 0.2);
  if (start < 15) tl.to(selector, { opacity: 0, y: -16, duration: 0.4 }, start + 4.5);
}

// Each feature chip lights up the part of the shed it names.
for (const [chip, glow, start] of [["#chip-doors", "#door-glow", 5.4], ["#chip-window", "#window-glow", 6.6], ["#chip-ready", null, 7.8]]) {
  tl.fromTo(chip, { opacity: 0, scale: 0.85 }, { opacity: 1, scale: 1, duration: 0.45, ease: "back.out(2)" }, start);
  if (glow) tl.fromTo(glow, { opacity: 0 }, { opacity: 0.55, duration: 0.3, yoyo: true, repeat: 1, repeatDelay: 0.4, ease: "power1.inOut" }, start);
}

const priceEl = document.getElementById("price");
const price = { value: 0 };
tl.fromTo(price, { value: 0 }, {
  value: 4200,
  duration: 1.4,
  ease: "power2.out",
  onUpdate: () => { priceEl.textContent = "$" + Math.round(price.value).toLocaleString("en-US"); },
}, 10.3);

window.__timelines["shed-listing"] = tl;
</script>
</body>
</html>
